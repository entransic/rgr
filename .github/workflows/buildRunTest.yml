name: Build, Run, and Test Go Binary

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  test-binary:
    runs-on: ubuntu-latest

    steps:
    # 1. Check out the repository code
    - name: Checkout code
      uses: actions/checkout@v4

    # 2. Install and set up the Go environment
    - name: Set up Go
      uses: actions/setup-go@v5
      with:
        go-version: '1.26' # Specify your preferred Go version
        cache: true        # Enables caching for faster subsequent builds

    # 3. Compile the Go application into an executable binary
    - name: Build Go Binary
      run: go build -v -o cmd/server/main.go

    # 4. Start the binary in the background and wait for it to be ready
    - name: Start Go Binary in Background
      run: |
        chmod +x cmd/server/bin/app
        nohup cmd/server/bin/app > server.log 2>&1 &

    - name: Wait for Server to be Ready
      run: |
        timeout 30s sh -c 'until nc -z localhost 8080; do sleep 1; done'

    # - name: Run Go Binary in Background
    #   run: |
    #     ./cmd/server/bin/app &
        
    #     # Give the binary a few seconds to start up and bind to its port
    #     echo "Waiting for application to start..."
    #     sleep 3 

    # 5. Run your Go tests (e.g., integration tests that hit the running binary)
    - name: Run Go Tests
      run:  | 
        go test -v ./...

    #6. Install Playwright and its dependencies
    - name: Setup Playwright
      uses: actions/setup-node@v4
      with:
        node-version: lts/*

    - name: Install Playwright
      run: |
        npm install -g playwright 

    #6. Run the Playwright tests
    - name: Run Playwright Tests
      run: npx playwright test ./tests

    - uses: actions/upload-artifact@v4
      if: ${{ !cancelled() }}
      with:
        name: playwright-report
        path: playwright-report/
        retention-days: 30
